<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Referral Program</title>
  <link rel="icon" type="image/png" href="logo-r-program.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash" class="screen splash">
  <img class="app-logo" src="logo-r-program.png" alt="R-Program">
  <h1>Referral Program</h1>
  <p>Aplikasi Pelaporan Referral</p>
  <button class="primary" onclick="showLogin()">MULAI</button>
  <small>Created by Dee</small>
</div>

<div id="login" class="screen hidden">
  <div class="card login-card">
    <img class="app-logo small-logo" src="logo-r-program.png" alt="R-Program">
    <h2>Login User</h2>
    <label>Nama User</label>
    <input id="loginName" placeholder="Masukkan nama user">
    <label>Jabatan</label>
    <select id="loginRole" style="margin-bottom: 28px;">
      <option value="petugas">Petugas</option>
      <option value="pejabat">Pejabat</option>
    </select>
    <button class="primary" onclick="login()">LOGIN</button>
    <button class="linkbtn" onclick="backSplash()">Kembali</button>
  </div>
</div>

<div id="app" class="hidden">
<header>
  <div>
    <h1>Referral Program</h1>
    <span id="userInfo"></span>
  </div>
  <button class="logout" onclick="logout()">Keluar</button>
</header>

<main id="home" class="page">
  <div class="grid">
    <button class="menu" onclick="openPage('loginPage')">
  <b>01</b>
  <span class="menu-icon">🔐</span>
  <span>Login User</span>
</button>

<button class="menu" onclick="openPage('inputPage')">
  <b>02</b>
  <span class="menu-icon">📝</span>
  <span>Input Referral</span>
</button>

<button id="dailyMenu" class="menu" onclick="openPage('dailyPage')">
  <b>03</b>
  <span class="menu-icon">📊</span>
  <span>Daily Report</span>
</button>

<button class="menu" onclick="openPage('printPage')">
  <b>04</b>
  <span class="menu-icon">🖨️</span>
  <span>Cetak Laporan</span>
</button>
      </div>
</main>

<section id="loginPage" class="page hidden">
 <div class="card">
  <h2>Login User</h2>
  <p><b>User aktif:</b> <span id="activeName"></span></p>
  <p><b>Role:</b> <span id="activeRole"></span></p>
  <button class="secondary" onclick="goHome()">Kembali</button>
 </div>
</section>

<section id="inputPage" class="page hidden">
 <div class="card">
  <h2>Input Referral</h2>
  <form id="refForm">
   <label>Tanggal</label><input id="tanggal" type="date" required>
 <label>Nama Petugas</label><input id="petugas" placeholder="Masukkan nama petugas" required>
   <label>Unit Kerja</label><input id="unit" required>
   <label>Nama Customer</label><input id="customer" required>
   <label>Jenis Produk</label>
   <select id="produk" required>
    <option value="">Pilih produk</option><option>KKB</option><option>KPR</option><option>KSM</option><option>KUR</option><option>AIA</option><option>BCAlife</option><option>Refinancing</option>
   </select>
   <label>Status</label>
   <select id="status" required>
    <option value="">Pilih status</option><option>Pengajuan berkas</option><option>Dalam proses pengecekan</option><option>Telah disetujui</option><option>Ditolak</option><option>Baru penawaran</option>
   </select>
   <div class="actions"><button class="primary" type="submit">SIMPAN REFERRAL</button><button class="secondary" type="button" onclick="goHome()">Kembali</button></div>
  </form>
 </div>
</section>

<section id="dailyPage" class="page hidden">
 <div class="card">
  <h2>Daily Report</h2>
<div class="tabs">
  <button onclick="renderDaily('user')">Per Nama</button>
  <button id="allDailyBtn" onclick="renderDaily('all')">Semua Nama</button>
</div>

<div id="dailyNameBox" style="display:none; margin-bottom:18px;">
  <label>Pilih Nama Petugas</label>
  <select id="dailyNameSelect" onchange="renderDailyByName()">
    <option value="">Pilih nama petugas</option>
  </select>
</div>

<div id="dailyContent"></div>
  <button class="secondary" onclick="goHome()">Kembali</button>
 </div>
</section>

<section id="printPage" class="page hidden">
 <div class="card">
  <h2>Cetak Laporan</h2>
  <div class="tabs">
  <button onclick="renderReport('user')">Per Nama</button>
  <button id="allReportBtn" onclick="renderReport('all')">Semua Nama</button>
</div>

<div id="reportNameBox" style="display:none; margin-bottom:18px;">
  <label>Pilih Nama Petugas</label>
  <select id="reportNameSelect" onchange="renderReportByName()">
    <option value="">Pilih nama petugas</option>
  </select>
</div>

<div id="reportContent"></div>
  <div class="actions">
   <button class="primary" onclick="printReport()">CETAK</button>
   <button class="primary" onclick="shareReport()">SHARE</button>
   <button class="secondary" onclick="goHome()">Kembali</button>
  </div>
 </div>
</section>

<script src="app.js"></script>
</body>
</html>
